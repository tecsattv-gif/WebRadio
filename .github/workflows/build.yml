name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar a parte Android do projeto
        run: |
          flutter create --platforms=android --org com.tecsattv --project-name webradio .
          rm -rf test

      - name: Chave de assinatura
        env:
          S1: ${{ secrets.WEBRADIO_KEYSTORE_PASSWORD }}
          S2: ${{ secrets.WEBRADIO_KEYSTORE }}
        run: |
          # A chave fica criptografada no repositório; a senha (segredo) abre.
          OK=""
          for RAW in "$S1" "$S2"; do
            [ -z "$RAW" ] && continue
            KP=$(printf '%s' "$RAW" | tr -d ' \r\n\t')
            echo "::add-mask::$KP"
            echo "::warning::Segredo testado com ${#KP} caracteres (o certo tem 24)"
            if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
                 -in keystore/release.jks.enc -out android/app/release.jks -pass "pass:$KP" 2>/dev/null \
               && keytool -list -keystore android/app/release.jks -storepass "$KP" > /dev/null 2>&1; then
              OK=1
              echo "KEYSTORE_PASSWORD=$KP" >> "$GITHUB_ENV"
              break
            fi
          done
          if [ -z "$OK" ]; then
            rm -f android/app/release.jks
            echo "::error::Nenhum segredo abre a chave. Apague e crie de novo WEBRADIO_KEYSTORE_PASSWORD com a senha de 24 letras/números."
            exit 1
          fi
          echo "Chave de assinatura OK"

      - name: Ajustar Android (Android Auto, player, assinatura)
        run: python3 tool/patch_android.py

      - name: Dependências e ícone
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Compilar APK
        run: |
          set +e
          flutter build apk --release 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          if [ $RC -ne 0 ]; then
            grep -E "error|Error:|\.dart:[0-9]+" build.log | grep -v "^\s*$" | head -25 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $RC

      - name: Nome do arquivo
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp build/app/outputs/flutter-apk/app-release.apk "WebRadio-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: WebRadio-${{ steps.ver.outputs.version }}
          path: WebRadio-${{ steps.ver.outputs.version }}.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: WebRádio ${{ steps.ver.outputs.version }}
          files: WebRadio-${{ steps.ver.outputs.version }}.apk
          make_latest: true
