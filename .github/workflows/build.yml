name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar a parte Android do projeto
        run: |
          flutter create --platforms=android --org com.tecsattv --project-name webradio .
          rm -rf test

      - name: Chave de assinatura
        env:
          KP: ${{ secrets.WEBRADIO_KEYSTORE_PASSWORD }}
        run: |
          # A chave fica criptografada no repositório; só a senha (segredo) abre.
          if [ -z "$KP" ]; then
            echo "::warning::Sem o segredo WEBRADIO_KEYSTORE_PASSWORD: APK com chave de teste."
            exit 0
          fi
          KP=$(printf '%s' "$KP" | tr -d ' \r\n\t')
          echo "::add-mask::$KP"
          if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in keystore/release.jks.enc -out android/app/release.jks -pass "pass:$KP" 2>/dev/null \
             || ! keytool -list -keystore android/app/release.jks -storepass "$KP" > /dev/null 2>&1; then
            echo "::error::A senha WEBRADIO_KEYSTORE_PASSWORD está errada. Cole de novo a senha do arquivo segredos-github-webradio.txt."
            exit 1
          fi
          echo "KEYSTORE_PASSWORD=$KP" >> "$GITHUB_ENV"
          echo "Chave de assinatura OK"

      - name: Ajustar Android (Android Auto, player, assinatura)
        run: python3 tool/patch_android.py

      - name: Dependências e ícone
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Compilar APK
        run: flutter build apk --release

      - name: Nome do arquivo
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp build/app/outputs/flutter-apk/app-release.apk "WebRadio-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: WebRadio-${{ steps.ver.outputs.version }}
          path: WebRadio-${{ steps.ver.outputs.version }}.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: WebRádio ${{ steps.ver.outputs.version }}
          files: WebRadio-${{ steps.ver.outputs.version }}.apk
          make_latest: true
